<!doctype html>
<!--
  itch.io profile header (1550x250): the HiGH logo at the left, and a field
  of the Ko-fi cover's tiles (docs/kofi-cover/cover.html) growing out of it
  to the right on the logo's own 50px grid, sparse by the logo and full by
  the right edge. Empty cells are transparent, so the itch background
  (bg.html) shows through.

  ?seed=N picks a layout, ?bg=C the page colour behind it. itch shows the
  header at 100% of the window width, so render at 2x, on black and on
  white, and recover the alpha from the pair:
    shot "file://$PWD/header.html?seed=4&bg=black" b.png --size 1550x250 --scale 2
    shot "file://$PWD/header.html?seed=4&bg=white" w.png --size 1550x250 --scale 2
    magick b.png w.png -alpha off \( -clone 0,1 -compose difference -composite -negate \) \
      \( -clone 0,2 +swap -compose divide -composite \) -delete 0,1 +swap \
      -compose copy_opacity -composite itch-header.png
-->
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; }
  /* Isolated, so the multiply squares blend with each other and not with the
     page: a square on an empty cell keeps its own colour on any background */
  #cover { position: relative; width: 1550px; height: 250px; overflow: hidden; isolation: isolate; }
  #cover div, #cover img { position: absolute; }
</style>
</head>
<body>
<div id="cover">
  <!-- 10 cells by 3, at column 1 and row 1 -->
  <img src="../../public/img/logo.svg" alt="" style="left:50px;top:50px;width:500px;height:150px;" />
</div>
<script>
  const params = new URLSearchParams(location.search);
  const seed = Number(params.get('seed') ?? 4);
  document.body.style.background = params.get('bg') ?? '#fff';
  const size = 50;

  // mulberry32: same seed, same cover
  let s = seed >>> 0;
  function random() {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  const CYAN = '#92f0ed';
  const PINK = '#ebb0ff';
  const RED = '#e70006';
  const HEX = { cyan: CYAN, pink: PINK, red: RED };

  const cover = document.getElementById('cover');
  const cols = 31;
  const rows = 5;
  // Column 11 stays white between the logo and the field
  const firstCol = 12;

  // How likely a cell is to hold a tile: rising to the right, and a little
  // behind in the rows above and below the logo, so the field reads as the
  // logo's three rows carrying on and then spreading out
  function fillChance(col, row) {
    const t = (col - firstCol + 1) / (cols - firstCol);
    const outer = row === 0 || row === rows - 1 ? 0.3 : 0;
    return Math.min(1, Math.max(0, 1.6 * t ** 1.5 - outer));
  }

  function pickColor() {
    const r = random();
    if (r < 0.06) return 'red';
    if (r < 0.53) return 'cyan';
    return 'pink';
  }

  function pickTile() {
    const c1 = pickColor();
    // Red stays solid: multiplied with anything it goes a darker red that
    // reads as a mistake beside the logo's
    if (c1 === 'red') return 'red';
    if (random() < 0.45) return c1 + '1';
    let c2 = pickColor();
    while (c2 === 'red') c2 = pickColor();
    return c1 + '+' + c2;
  }

  function colorsOf(t) {
    if (!t) return [];
    if (t === 'diamond') return ['red'];
    if (t === 'triangle') return ['pink', 'cyan'];
    if (t === 'red') return ['red'];
    if (t === 'cyan1') return ['cyan'];
    if (t === 'pink1') return ['pink'];
    return t.split('+');
  }

  const overlaps = (a, b) => a.some((c) => b.includes(c));

  // Which cells get a tile at all
  const filled = [];
  for (let row = 0; row < rows; row++) {
    for (let col = firstCol; col < cols; col++) {
      if (random() < fillChance(col, row)) filled.push(row * cols + col);
    }
  }

  // Spread diamonds and triangles evenly over the filled cells, with jitter,
  // as the Ko-fi cover does
  function evenSlots(rate, start) {
    const slots = new Set();
    const interval = Math.floor(filled.length / Math.max(1, Math.round(filled.length * rate)));
    for (let i = Math.floor(interval * start); i < filled.length; i += interval) {
      const j = i + Math.floor((random() - 0.5) * Math.floor(interval * 0.4));
      if (j >= 0 && j < filled.length) slots.add(filled[j]);
    }
    return slots;
  }
  const diamondSlots = evenSlots(0.06, 1 / 2);
  const triangleSlots = evenSlots(0.07, 1 / 3);

  const types = new Array(cols * rows).fill(null);
  for (const i of filled) {
    let pick;
    if (diamondSlots.has(i)) pick = 'diamond';
    else if (triangleSlots.has(i)) pick = 'triangle';
    else {
      // Anti-clump against the left neighbour (same row) and the tile above
      const left = types[i - 1];
      const above = types[i - cols];
      const clashes = (t) => overlaps(colorsOf(t), colorsOf(left)) || overlaps(colorsOf(t), colorsOf(above));
      pick = pickTile();
      // Between a cyan and a pink neighbour only red passes, so rerolls that
      // could land on red would pile it up; skip red and leave the cell
      // white when nothing fits
      for (let n = 0; n < 20 && clashes(pick); n++) {
        do pick = pickTile(); while (pick === 'red');
      }
      if (clashes(pick)) pick = null;
    }
    types[i] = pick;
  }

  function square(x, y, color, extra = '') {
    const el = document.createElement('div');
    el.style.cssText = `left:${x}px;top:${y}px;width:${size}px;height:${size}px;background:${color};` +
      (color === RED ? '' : 'mix-blend-mode:multiply;') + extra;
    cover.appendChild(el);
  }

  function triangle(x, y) {
    square(x, y, PINK, 'clip-path:polygon(100% 0%,0% 100%,100% 100%);');
  }

  function diamond(x, y) {
    const el = document.createElement('div');
    el.style.cssText = `left:${x + size * 0.15}px;top:${y + size * 0.15}px;` +
      `width:${size * 0.7}px;height:${size * 0.7}px;background:${RED};transform:rotate(45deg);`;
    cover.appendChild(el);
  }

  types.forEach((type, i) => {
    if (!type) return;
    const x = (i % cols) * size;
    const y = Math.floor(i / cols) * size;

    if (type === 'diamond') return diamond(x, y);
    if (type === 'triangle') {
      // On cyan, on pink, or on white as in the logo's G; deeper stacks go
      // a heavy blue-violet the logo never uses
      const bgs = [[CYAN], [PINK], []][Math.floor(random() * 3)];
      bgs.forEach((c) => square(x, y, c));
      return triangle(x, y);
    }
    colorsOf(type).forEach((c) => square(x, y, HEX[c]));
  });
</script>
</body>
</html>
